name = "tfm-survey"
main = ".open-next/worker.js"
compatibility_date = "2026-02-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "TFM_DB"
database_name = "tfm-db"
database_id = "PLACEHOLDER"  # Replace after: wrangler d1 create tfm-db
